# modern build tools use this file: https://packaging.python.org/en/latest/tutorials/packaging-projects/ 
# you need to drop setup_requires from setup.py as well.
# https://peps.python.org/pep-0518/#rationale

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "altamus_py"
version = "0.1.2"
description = "Library for interacting with EOS2 Scanners and their binary scan files"
requires-python = ">=3.8"
dependencies = [
    "pypcd4",
    "numpy",
    "simplejson",
]

[tool.setuptools.packages]
find = {where = ["src"]}